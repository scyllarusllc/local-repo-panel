<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Local Repo Panel — Local Repository &amp; Dev Server Dashboard</title><meta name="description" content="Browse local repositories, start and stop dev servers, and restart apps with automatic port cleanup."><link rel="stylesheet" href="/style.css"></head><body><header><div class="mx-auto flex max-w-[1600px] flex-wrap items-center justify-between gap-4 px-6 py-8 lg:px-10"><div><span class="eyebrow">LOCAL PROJECT CONTROL</span><h1>Local Repo Panel</h1><p>Browse and run projects in <code>~/github</code></p></div><div id="count" class="count"></div></div></header><main class="mx-auto max-w-[1600px] px-6 py-6 lg:px-10"><div class="toolbar"><input id="search" type="search" placeholder="Search projects…" aria-label="Search projects"><select id="sort" aria-label="Sort projects"><option value="updated_at">Recently updated</option><option value="created_at">Recently created</option><option value="github_updated_at">GitHub recently updated</option><option value="name">First character / A–Z</option></select><button id="refresh">Refresh</button></div><div id="notice" role="status"></div><div class="table-wrap"><table><thead><tr><th>Project</th><th>Status</th><th>Start command</th><th>App link</th><th>Project link</th><th>Local updated</th><th>Created</th><th title="GitHub repository updated_at">GitHub updated</th><th>Actions</th></tr></thead><tbody id="list"></tbody></table></div></main><dialog id="settings"><form method="dialog"><h2 id="settings-title">Project settings</h2><label>Start command<input id="command" placeholder="npm run dev"></label><label>App URL<input id="url" type="url" placeholder="http://127.0.0.1:3000"></label><label>Project link<input id="link" type="url" placeholder="https://github.com/..."></label><p class="hint">Commands run in the project directory. Only processes started here can be stopped here.</p><div class="dialog-actions"><button value="cancel">Cancel</button><button id="save" value="save">Save</button></div></form></dialog><script src="/app.js"></script></body></html>
